# Xcode project for the release build only (./release.sh). Day-to-day building
# uses SwiftPM (./build.sh). Generated with xcodegen; the .xcodeproj is not kept.
name: MabenAwake
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: "YES"
    DEBUG_INFORMATION_FORMAT: dwarf
    DEAD_CODE_STRIPPING: "YES"
targets:
  MabenAwake:
    type: application
    platform: macOS
    sources:
      - path: Sources/MabenAwake
      - path: Resources/awake
        buildPhase: resources
      - path: Resources/install-lid-helper.sh
        buildPhase: resources
      - path: Resources/install-failsafe.sh
        buildPhase: resources
      - path: build/AppIcon.icns
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Maben Awake
        EXECUTABLE_NAME: MabenAwake
        PRODUCT_BUNDLE_IDENTIFIER: com.maxbenschop.sleepwalker   # changes to gg.maben.awake in a later release, see Legacy.swift
        INFOPLIST_FILE: build/Info-release.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Release.entitlements
    postBuildScripts:
      # The names 1.4 used, as links: its launch agent starts the app by the old name once
      # after updating, and open agent sessions still call the old hook (see Legacy.swift).
      - name: Links with the old names
        basedOnDependencyAnalysis: false
        script: |
          cd "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH"
          ln -sf MabenAwake Sleepwalker
          ln -sf maben-awake-hook sleepwalker-hook
    dependencies:
      - sdk: IOKit.framework
      - target: Hook
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: Failsafe
        embed: true
        codeSign: true
        copy:
          destination: executables
  Hook:
    type: tool
    platform: macOS
    sources: [Sources/MabenAwakeHook]
    settings:
      base:
        PRODUCT_NAME: maben-awake-hook
        PRODUCT_BUNDLE_IDENTIFIER: gg.maben.awake.hook
        SKIP_INSTALL: "YES"
  Failsafe:
    type: tool
    platform: macOS
    sources: [Sources/MabenAwakeFailsafe]
    settings:
      base:
        PRODUCT_NAME: maben-awake-failsafe
        PRODUCT_BUNDLE_IDENTIFIER: gg.maben.awake.failsafe
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: IOKit.framework
      - sdk: SystemConfiguration.framework
